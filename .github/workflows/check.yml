name: Перевірка графіка

# Кожен запуск ~55 хв перевіряє графік кожні 2 хв, а наприкінці сам запускає
# наступний. Cron — запасний варіант, якщо ланцюжок колись обірветься.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # зберігати пам'ять бота (state/state.json)
  actions: write    # запускати наступний цикл

concurrency:
  group: schedule-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановлення
        run: pip install -r requirements.txt

      - name: Перевірка і публікація (цикл ~55 хв)
        env:
          BOT_TOKEN:  ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          LOOP_MINUTES: "2"
          LOOP_TOTAL_MINUTES: "55"
          PUSH_STATE: "1"
        run: python bot.py

      - name: Запуск наступного циклу
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Якщо в черзі вже чекає запуск (від cron), новий не створюємо.
          q=$(gh run list -R "$GITHUB_REPOSITORY" -w check.yml -s queued --json databaseId -q 'length')
          p=$(gh run list -R "$GITHUB_REPOSITORY" -w check.yml -s pending --json databaseId -q 'length')
          if [ "$q" = "0" ] && [ "$p" = "0" ]; then
            gh workflow run check.yml -R "$GITHUB_REPOSITORY" --ref main
          fi
